apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: gotenberg
  name: gotenberg
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: gotenberg
  strategy: {}
  template:
    metadata:
      labels:
        io.kompose.network/kompose-default: "true"
        io.kompose.service: gotenberg
    spec:
      containers:
        - args:
            - gotenberg
            - --chromium-disable-javascript=true
            - --chromium-allow-list=file:///tmp/.*
          image: {{ .Values.images.gotenberg }}
          name: gotenberg
          ports:
            - containerPort: 3000
              protocol: TCP
          resources: {}
      restartPolicy: Always
status: {}
